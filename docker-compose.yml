services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: quiet_camps
      POSTGRES_PASSWORD: quiet_camps # local only
      POSTGRES_DB: quiet_camps
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18 keeps its data under a versioned folder inside this path
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quiet_camps -d quiet_camps"]
      interval: 2s
      timeout: 3s
      retries: 15

  # The API from its image, on port 8000: docker compose --profile full up -d --wait
  # Without the profile, only Postgres starts (the tests and `uv run uvicorn` need only that).
  api:
    profiles: [full]
    build: api
    environment:
      DATABASE_URL: postgresql+psycopg://quiet_camps:quiet_camps@db:5432/quiet_camps
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
